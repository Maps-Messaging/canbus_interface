    CHAR2:
      typeNumber: 18
      hex: '0x12'
      bits: 2x8
      range:
        min: -127
        max: 128
      explanation: Two signed chars
    UCHAR2:
      typeNumber: 19
      hex: '0x13'
      bits: 2x8
      range:
        min: 0
        max: 255
      explanation: Two unsigned chars
    BCHAR2:
      typeNumber: 20
      hex: '0x14'
      bits: 2x8
      range: null
      explanation: Two discrete chars
    MEMID:
      typeNumber: 21
      hex: '0x15'
      bits: 32
      range:
        min: 0
        max: 4294967295
      explanation: Memory ID for upload/download
    CHKSUM:
      typeNumber: 22
      hex: '0x16'
      bits: 32
      range:
        min: 0
        max: 4294967295
      explanation: Checksum for upload/download
    ACHAR:
      typeNumber: 23
      hex: '0x17'
      bits: 8
      range:
        min: 0
        max: 255
      explanation: ASCII character
    ACHAR2:
      typeNumber: 24
      hex: '0x18'
      bits: 2x8
      range:
        min: 0
        max: 255
      explanation: Two ASCII characters
    ACHAR4:
      typeNumber: 25
      hex: '0x19'
      bits: 4x8
      range:
        min: 0
        max: 255
      explanation: Four ASCII characters
    VARIABLE3:
      typeNumber: 100
      hex: '0x64'
      bits: 3x8
      range: null
      explanation: 17 to 24-bit signed 2’s complement integer
    UVARIABLE3:
      typeNumber: 101
      hex: '0x65'
      bits: 3x8
      range: null
      explanation: 17 to 24-bit unsigned integer
    UDEF:
      typeNumber: 102
      hex: '0x66'
      bits: null
      range: null
      explanation: User-defined data types (102-255)
  byNumber:
    0: NODATA
