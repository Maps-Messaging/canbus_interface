meta:
  schema: CANaerospace
  version: '1.3'
  generated: '2026-03-03'
  notes:
    - Clean CANaerospace schema (no SAE J1939 PGN/SPN/PDU concepts).
    - Multi-byte values are big-endian (Motorola).
    - Standard CANaerospace messages here assume DLC=8.
    - Content populated from user-provided extracted tables (message types, data types, node services, identifier lists).
    - Expanded identifier ranges and navigation/engine/electrical/hydraulic/landing/misc identifiers from user-provided tables.
    - Added Native Format Message Channels, baseline example node IDs, and example time slot allocation tables (as optional/illustrative
      metadata).
messageTypes:
  - name: EED
    title: Emergency Event Data
    idRange:
      min: 0
      max: 127
    hexRange:
      min: '0x000'
      max: '0x07F'
    explanation: Transmitted asynchronously whenever a situation requiring immediate action occurs.
  - name: NSH
    title: High Priority Node Service Data
    idRange:
      min: 128
      max: 199
    hexRange:
      min: '0x080'
      max: '0x0C7'
    channels: 36
    explanation: Transmitted asynchronously or cyclic with defined transmission intervals (36 channels). Can be unique to an
      avionic or suite of avionics.
  - name: UDH
    title: High Priority User-Defined Data
    idRange:
      min: 200
      max: 299
    hexRange:
      min: '0x0C8'
      max: '0x12B'
    explanation: Message/data format and transmission intervals entirely user-defined. Can be unique to an avionic or suite
      of avionics.
  - name: NOD
    title: Normal Operation Data
    idRange:
      min: 300
      max: 1799
    hexRange:
      min: '0x12C'
      max: '0x707'
    explanation: Transmitted asynchronously or cyclic with defined transmission intervals for operational and status data.
  - name: UDL
    title: Low Priority User-Defined Data
    idRange:
      min: 1800
      max: 1899
    hexRange:
      min: '0x708'
      max: '0x76B'
    explanation: Message/data format and transmission intervals entirely user-defined. Can be unique to an avionic or suite
      of avionics.
  - name: DSD
    title: Debug Service Data
    idRange:
      min: 1900
      max: 1999
    hexRange:
      min: '0x76C'
      max: '0x7CF'
    explanation: Transmitted asynchronously or cyclic for debug communication & software download actions.
  - name: NSL
    title: Low Priority Node Service Data
    idRange:
      min: 2000
      max: 2031
    hexRange:
      min: '0x7D0'
      max: '0x7EF'
    channels: 16
    explanation: Transmitted asynchronously or cyclic for test & maintenance actions (16 channels), or other user-defined actions.
frame:
  dlc:
    expected: 8
  endianness: big
  payloadLayout:
    - name: nodeId
      byteOffset: 0
      byteLength: 1
      type: uint8
    - name: dataType
      byteOffset: 1
      byteLength: 1
      type: uint8
    - name: serviceCode
      byteOffset: 2
      byteLength: 1
      type: uint8
    - name: messageCode
      byteOffset: 3
      byteLength: 1
      type: uint8
    - name: data
      byteOffset: 4
      byteLength: 4
      type: bytes[4]
dataTypes:
  byName:
    NODATA:
      typeNumber: 0
      hex: '0x00'
      bits: 0
      range: null
      explanation: No data type
    ERROR:
