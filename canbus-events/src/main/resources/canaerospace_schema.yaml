        min: 0
        max: 4294967295
      explanation: Unsigned integer
    BLONG:
      typeNumber: 5
      hex: '0x05'
      bits: 32
      range: null
      explanation: Discrete states (32 bits coded into 4 bytes)
    SHORT:
      typeNumber: 6
      hex: '0x06'
      bits: 16
      range:
        min: -32767
        max: 32768
      explanation: 2’s complement short
    USHORT:
